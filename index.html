<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Мой агент</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #f8f9fa;
            padding: 20px;
            -webkit-text-size-adjust: 100%;
        }
        .container {
            width: 400px;
            max-width: 100%;
            padding: 24px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-radius: 12px;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin-bottom: .5rem; color: #111; }
        p  { color: #555; font-size: .95rem; margin-bottom: 1rem; }
        .note {
            font-size: .8rem;
            color: #999;
            background: #f3f4f6;
            border-radius: 8px;
            padding: 8px;
        }

        /* Кнопка "вниз": видна всегда, поднята над кнопкой виджета */
        #scroll-bottom-btn {
            position: fixed;
            right: calc(12px + env(safe-area-inset-right, 0px));
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            z-index: 2147483647;
            width: 44px; height: 44px;
            border: none; border-radius: 50%;
            background: rgba(17,17,17,.72);
            color: #fff; font-size: 20px; line-height: 44px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            cursor: pointer;
            opacity: .92;
        }
        #scroll-bottom-btn.hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ваш персональный агент</h1>
        <p>Задайте вопрос и получите ответ от ИИ-ассистента</p>
        <div class="note">Чтобы чат открывался, страница должна открываться по http:// (не по file://)</div>
    </div>

    <!-- ОБЯЗАТЕЛЬНО: контейнер, в который виджет ставит кнопку/чат -->
    <div id="yandex-ai-widget"></div>

    <button id="scroll-bottom-btn" type="button" aria-label="Вниз" title="Вниз">&#8595;</button>

    <!-- Загрузчик виджета -->
    <script src="https://widget.aistudio.yandexcloud.net/scripts/widget-loader.js?channel-id=aactka1fkpikhj820nda"></script>

    <script>
    (function () {
        'use strict';

        /* ---------- 1. Поиск всех прокручиваемых контейнеров (вкл. shadow DOM/iframe) ---------- */
        function isScrollable(el) {
            if (!el || el.nodeType !== 1) return false;
            var st;
            try { st = getComputedStyle(el); } catch (e) { return false; }
            if (!/(auto|scroll|overlay)/.test(st.overflowY)) return false;
            return (el.scrollHeight - el.clientHeight) > 4;
        }

        function walk(node, out) {
            var els;
            try { els = node.querySelectorAll('*'); } catch (e) { return; }
            for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (isScrollable(el)) out.push(el);
                if (el.shadowRoot) walk(el.shadowRoot, out);
                if (el.tagName === 'IFRAME') {
                    try {
                        var d = el.contentDocument;      // сработает только для same-origin
                        if (d && d.body) walk(d, out);
                    } catch (e) { /* cross-origin — недоступно */ }
                }
            }
        }

        function scrollables() {
            var out = [];
            walk(document, out);
            var se = document.scrollingElement || document.documentElement;
            if (se) out.push(se);
            out.push(document.documentElement);
            if (document.body) out.push(document.body);
            return out;
        }

        /* ---------- 2. Прокрутка вниз ---------- */
        function goBottomToEnd() {
            var list = scrollables(), i, el;
            for (i = 0; i < list.length; i++) {
                el = list[i];
                try {
                    el.scrollTop = el.scrollHeight;
                    if (el.lastElementChild && el.lastElementChild.scrollIntoView) {
                        el.lastElementChild.scrollIntoView({ block: 'end' });
                    }
                } catch (e) {}
            }
            try { window.scrollTo(0, document.documentElement.scrollHeight); } catch (e) {}
        }

        function scrollToBottom(keep) {
            goBottomToEnd();
            var delays = keep ? [0, 30, 80, 150, 250, 400, 600, 900, 1300, 1800, 2500] : [0, 60, 160];
            delays.forEach(function (d) { setTimeout(goBottomToEnd, d); });
        }
        window.scrollToBottom = scrollToBottom;

        /* ---------- 3. Реакция на поворот/изменение размера ---------- */
        var stick = true;                       // держать низ, пока пользователь сам не отлистал вверх
        var lastH = window.innerHeight;

        function userIsNearBottom() {
            var se = document.scrollingElement || document.documentElement;
            if (!se) return true;
            return (se.scrollHeight - se.scrollTop - se.clientHeight) < 200;
        }

        window.addEventListener('scroll', function () { stick = userIsNearBottom(); }, { passive: true });

        function onRotate() {
            stick = true;                       // после поворота всегда возвращаемся вниз
            scrollToBottom(true);
        }

        window.addEventListener('orientationchange', function () {
            scrollToBottom(true);
            setTimeout(onRotate, 60);
            setTimeout(onRotate, 400);
        });

        window.addEventListener('resize', function () {
            var h = window.innerHeight;
            var rotated = Math.abs(h - lastH) > 80;
            lastH = h;
            if (rotated || stick) scrollToBottom(true);
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function () { scrollToBottom(true); });
            window.visualViewport.addEventListener('scroll', function () { if (stick) goBottomToEnd(); });
        }

        if (window.screen && screen.orientation && screen.orientation.addEventListener) {
            screen.orientation.addEventListener('change', onRotate);
        }

        /* Догоняем виджет, пока он перерисовывается после поворота */
        var chaseTimer = null;
        function chase(ms) {
            clearInterval(chaseTimer);
            var t0 = Date.now();
            chaseTimer = setInterval(function () {
                goBottomToEnd();
                if (Date.now() - t0 > ms) clearInterval(chaseTimer);
            }, 120);
        }
        window.addEventListener('orientationchange', function () { chase(2500); });

        /* ---------- 4. Кнопка "вниз" ---------- */
        var btn = document.getElementById('scroll-bottom-btn');
        function syncBtn() {
            if (!btn) return;
            if (userIsNearBottom()) btn.classList.add('hidden');
            else btn.classList.remove('hidden');
        }
        if (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                stick = true;
                scrollToBottom(true);
                chase(1500);
            });
        }
        window.addEventListener('scroll', function () { syncBtn(); }, { passive: true });
        window.addEventListener('orientationchange', function () { setTimeout(syncBtn, 300); });
        setTimeout(syncBtn, 800);

        /* ---------- 5. Первичное открытие: сразу вниз ---------- */
        window.addEventListener('load', function () { scrollToBottom(false); setTimeout(syncBtn, 500); });
        window.addEventListener('DOMContentLoaded', function () {
            if (document.getElementById('yandex-ai-widget')) {
                console.log('Контейнер виджета найден');
            }
            scrollToBottom(false);
        });
    })();
    </script>
</body>
</html>

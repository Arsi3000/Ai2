<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background: #f5f5f5; }
        
        /* Боковая панель */
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        .sidebar h2 { font-size: 16px; color: #333; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 13px; font-weight: 600; color: #555; }
        .field select, .field input {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }
        .field input:focus, .field select:focus { outline: none; border-color: #2563eb; }
        .hint { font-size: 11px; color: #888; line-height: 1.4; }
        .hint a { color: #2563eb; text-decoration: none; }
        
        /* Чат */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 280px);
        }
        .chat-header {
            padding: 12px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header .model-tag {
            font-size: 12px;
            background: #eef2ff;
            color: #2563eb;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .msg.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.bot {
            align-self: flex-start;
            background: #fff;
            color: #222;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 4px;
        }
        .msg.system {
            align-self: center;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            border-radius: 8px;
        }
        .msg.error {
            align-self: center;
            background: #fee2e2;
            color: #991b1b;
            font-size: 13px;
            border-radius: 8px;
        }
        
        /* Ввод */
        .input-area {
            padding: 16px 20px;
            background: #fff;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
        }
        .input-area textarea:focus { outline: none; border-color: #2563eb; }
        .input-area button {
            padding: 10px 20px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            height: 44px;
        }
        .input-area button:disabled { background: #93c5fd; cursor: not-allowed; }
        .input-area button:hover:not(:disabled) { background: #1d4ed8; }
        
        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #dcfce7;
            color: #166534;
            font-weight: 600;
            margin-left: 4px;
        }
    </style>
</head>
<body>

<!-- ============ БОКОВАЯ ПАНЕЛЬ ============ -->
<div class="sidebar">
    <h2>⚙️ Настройки</h2>

    <div class="field">
        <label>Провайдер</label>
        <select id="providerSelect">
            <option value="openrouter">OpenRouter (бесплатные :free)</option>
            <option value="google">Google AI Studio (Gemini)</option>
            <option value="groq">Groq (быстрый)</option>
            <option value="cerebras">Cerebras</option>
            <option value="custom">Другой (OpenAI-совместимый)</option>
        </select>
    </div>

    <div class="field">
        <label>API-ключ</label>
        <input type="password" id="apiKey" placeholder="sk-... или ключ провайдера">
        <div class="hint" id="keyHint">
            <a href="https://openrouter.ai/keys" target="_blank">Получить ключ OpenRouter →</a>
        </div>
    </div>

    <div class="field" id="customBaseField" style="display:none;">
        <label>Base URL</label>
        <input type="text" id="customBaseUrl" placeholder="https://api.example.com/v1">
    </div>

    <div class="field">
        <label>Модель</label>
        <select id="modelSelect"></select>
        <div class="hint" id="modelHint"></div>
    </div>

    <div class="field">
        <label>System prompt (опционально)</label>
        <input type="text" id="systemPrompt" placeholder="Ты — полезный ассистент..." value="Ты — полезный ассистент. Отвечай кратко и по делу.">
    </div>

    <button id="clearChatBtn" style="padding:8px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;font-size:13px;">🗑 Очистить чат</button>

    <div class="hint" style="margin-top:auto;padding-top:12px;border-top:1px solid #eee;">
        💡 Ключ хранится только в твоём браузере (sessionStorage). Никуда не отправляется, кроме выбранного API.
    </div>
</div>

<!-- ============ ЧАТ ============ -->
<div class="chat-area">
    <div class="chat-header">
        <span>💬 Чат</span>
        <span class="model-tag" id="currentModelTag">—</span>
    </div>
    <div class="messages" id="messages">
        <div class="msg system">Выбери провайдера, введи API-ключ и начни общение.</div>
    </div>
    <div class="input-area">
        <textarea id="userInput" placeholder="Напиши сообщение..." rows="1"></textarea>
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script>
// ==================== ДАННЫЕ МОДЕЛЕЙ ====================
const PROVIDERS = {
    openrouter: {
        baseUrl: "https://openrouter.ai/api/v1",
        keyUrl: "https://openrouter.ai/keys",
        keyHint: '<a href="https://openrouter.ai/keys" target="_blank">Получить ключ OpenRouter →</a> (нужен положительный баланс, даже $0)',
        models: [
            { id: "nvidia/nemotron-3-ultra-550b-a55b:free", name: "Nemotron 3 Ultra (free, 1M ctx)" },
            { id: "google/gemma-4-31b-it:free", name: "Gemma 4 31B (free)" },
            { id: "qwen/qwen3-coder:free", name: "Qwen3 Coder (free)" },
            { id: "openai/gpt-oss-20b:free", name: "GPT-OSS 20B (free)" },
            { id: "cohere/north-mini-code:free", name: "Cohere North Mini Code (free)" },
            { id: "baidu/ernie-5.5-flash-preview:free", name: "ERNIE 5.5 Flash (free)" },
            { id: "nvidia/nemotron-3.5-lightning:free", name: "Nemotron 3.5 Lightning (free, 1M)" },
        ]
    },
    google: {
        baseUrl: "https://generativelanguage.googleapis.com/v1beta/openai",
        keyUrl: "https://aistudio.google.com/app/apikey",
        keyHint: '<a href="https://aistudio.google.com/app/apikey" target="_blank">Получить ключ Google AI Studio →</a> (бесплатно, без карты)',
        models: [
            { id: "gemini-2.5-flash", name: "Gemini 2.5 Flash" },
            { id: "gemini-2.5-flash-lite", name: "Gemini 2.5 Flash-Lite" },
            { id: "gemini-3-flash", name: "Gemini 3 Flash (если доступен)" },
            { id: "gemma-3-27b-it", name: "Gemma 3 27B" },
        ]
    },
    groq: {
        baseUrl: "https://api.groq.com/openai/v1",
        keyUrl: "https://console.groq.com/keys",
        keyHint: '<a href="https://console.groq.com/keys" target="_blank">Получить ключ Groq →</a> (бесплатно)',
        models: [
            { id: "llama-3.3-70b-versatile", name: "Llama 3.3 70B" },
            { id: "llama-3.1-8b-instant", name: "Llama 3.1 8B (быстрый)" },
            { id: "openai/gpt-oss-20b", name: "GPT-OSS 20B" },
            { id: "qwen/qwen3-32b", name: "Qwen3 32B" },
        ]
    },
    cerebras: {
        baseUrl: "https://api.cerebras.ai/v1",
        keyUrl: "https://cloud.cerebras.ai/",
        keyHint: '<a href="https://cloud.cerebras.ai/" target="_blank">Получить ключ Cerebras →</a> (бесплатный тариф)',
        models: [
            { id: "llama3.1-8b", name: "Llama 3.1 8B" },
            { id: "llama-3.3-70b", name: "Llama 3.3 70B" },
            { id: "gpt-oss-120b", name: "GPT-OSS 120B" },
        ]
    },
    custom: {
        baseUrl: "",
        keyUrl: "",
        keyHint: 'Введи свой Base URL и модель (должен поддерживать OpenAI-совместимый /chat/completions)',
        models: [{ id: "", name: "— введи ID модели вручную ниже —" }]
    }
};

// ==================== DOM ====================
const providerSelect = document.getElementById('providerSelect');
const apiKeyInput = document.getElementById('apiKey');
const keyHint = document.getElementById('keyHint');
const modelSelect = document.getElementById('modelSelect');
const modelHint = document.getElementById('modelHint');
const currentModelTag = document.getElementById('currentModelTag');
const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const clearChatBtn = document.getElementById('clearChatBtn');
const customBaseField = document.getElementById('customBaseField');
const customBaseUrl = document.getElementById('customBaseUrl');
const systemPrompt = document.getElementById('systemPrompt');

let chatHistory = [];

// ==================== ВОССТАНОВЛЕНИЕ КЛЮЧА ====================
const savedKey = sessionStorage.getItem('ai_chat_key');
if (savedKey) apiKeyInput.value = savedKey;
apiKeyInput.addEventListener('input', () => sessionStorage.setItem('ai_chat_key', apiKeyInput.value));

// ==================== ОБНОВЛЕНИЕ UI ====================
function updateProviderUI() {
    const p = PROVIDERS[providerSelect.value];
    keyHint.innerHTML = p.keyHint;
    customBaseField.style.display = providerSelect.value === 'custom' ? 'flex' : 'none';

    modelSelect.innerHTML = '';
    p.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name;
        modelSelect.appendChild(opt);
    });

    if (providerSelect.value === 'custom') {
        modelSelect.innerHTML = '<option value="">— выбери или введи ID ниже —</option>';
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'customModelId';
        input.placeholder = 'например, my-model-v1';
        input.style.cssText = 'margin-top:6px;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;width:100%;';
        modelSelect.parentNode.appendChild(input);
    } else {
        const old = document.getElementById('customModelId');
        if (old) old.remove();
    }

    updateModelTag();
}

function updateModelTag() {
    const val = modelSelect.value || (document.getElementById('customModelId')?.value) || '—';
    currentModelTag.textContent = val.length > 40 ? val.slice(0, 38) + '…' : val;
}

providerSelect.addEventListener('change', updateProviderUI);
modelSelect.addEventListener('change', updateModelTag);
document.addEventListener('input', (e) => {
    if (e.target.id === 'customModelId') updateModelTag();
});

// ==================== ОТПРАВКА ====================
async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const key = apiKeyInput.value.trim();
    if (!key) {
        appendMessage('error', '⚠️ Введи API-ключ в боковой панели.');
        return;
    }

    let modelId = modelSelect.value;
    if (providerSelect.value === 'custom') {
        modelId = document.getElementById('customModelId')?.value?.trim();
        if (!modelId) {
            appendMessage('error', '⚠️ Укажи ID модели для custom-провайдера.');
            return;
        }
    }

    const baseUrl = providerSelect.value === 'custom'
        ? customBaseUrl.value.trim().replace(/\/+$/, '')
        : PROVIDERS[providerSelect.value].baseUrl;

    if (!baseUrl) {
        appendMessage('error', '⚠️ Укажи Base URL.');
        return;
    }

    // Добавляем сообщение пользователя
    appendMessage('user', text);
    chatHistory.push({ role: 'user', content: text });
    userInput.value = '';
    autoResize();

    sendBtn.disabled = true;
    sendBtn.textContent = '...';

    try {
        const messages = [];
        const sys = systemPrompt.value.trim();
        if (sys) messages.push({ role: 'system', content: sys });
        messages.push(...chatHistory);

        const res = await fetch(`${baseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
                model: modelId,
                messages: messages,
                max_tokens: 2000,
                stream: false
            })
        });

        if (!res.ok) {
            const err = await res.text();
            throw new Error(`HTTP ${res.status}: ${err.slice(0, 300)}`);
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || '(пустой ответ)';
        appendMessage('bot', reply);
        chatHistory.push({ role: 'assistant', content: reply });

    } catch (e) {
        appendMessage('error', `❌ Ошибка: ${e.message}`);
    } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Отправить';
    }
}

function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ==================== ВВОД ====================
sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}
userInput.addEventListener('input', autoResize);

// ==================== ОЧИСТКА ====================
clearChatBtn.addEventListener('click', () => {
    chatHistory = [];
    messagesDiv.innerHTML = '<div class="msg system">Чат очищен. Выбери модель и начни заново.</div>';
    currentModelTag.textContent = modelSelect.value || '—';
});

// ==================== СТАРТ ====================
updateProviderUI();
</script>
</body>
</html>
